name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-core:
    name: Core logic (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  macos-app:
    name: App (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle Espazio.app, .dmg and .pkg (release, ad-hoc signed)
        run: scripts/package.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Espazio-app
          path: build/Espazio.zip
          retention-days: 14
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Espazio-installers
          path: |
            build/Espazio-*.dmg
            build/Espazio-*.pkg
          retention-days: 14
