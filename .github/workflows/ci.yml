name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # Never cancel a push run: it may be publishing a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    name: Commits (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install commitlint
        run: npm install --no-save --no-package-lock --no-audit --no-fund @commitlint/cli@19 @commitlint/config-conventional@19
      - name: Lint commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FROM="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            FROM="${{ github.event.before }}"
          else
            git fetch --no-tags origin main
            FROM="$(git merge-base origin/main HEAD)"
          fi
          # A new branch or a force push may report an unknown "before": fall back to main.
          git cat-file -e "$FROM^{commit}" 2>/dev/null || FROM="$(git merge-base origin/main HEAD)"
          npx commitlint --from "$FROM" --to HEAD --verbose

  linux-core:
    name: Core logic (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  macos-app:
    name: App (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle Espazio.app, .dmg and .pkg (release, ad-hoc signed)
        run: scripts/package.sh
      - name: Smoke test (launch the bundled app)
        run: scripts/smoke-test.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Espazio-app
          path: build/Espazio.zip
          retention-days: 14
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Espazio-installers
          path: |
            build/Espazio-*.dmg
            build/Espazio-*.pkg
          retention-days: 14

  release:
    name: Release (semantic-release)
    needs: [commits, linux-core, macos-app]
    if: github.event_name == 'push'
    runs-on: macos-15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install semantic-release
        run: npm install --no-save --no-package-lock --no-audit --no-fund semantic-release@24 @semantic-release/exec@6 @semantic-release/changelog@6 @semantic-release/git@10 conventional-changelog-conventionalcommits@8
      - name: Publish version (beta on work branches, release on main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
